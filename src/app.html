<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Added to a phone's home screen, it opens fullscreen and sideways, like an app -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Lantern Corps" />
		<meta name="theme-color" content="#03060a" />
		<meta name="text-scale" content="scale" />
		<!-- What a shared link shows (X, iMessage, WhatsApp, Discord) -->
		<meta name="description" content="A Green Lantern game you play in your browser. Build constructs with the ring and fight across two seasons: 28 missions, free." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Lantern Corps" />
		<meta property="og:title" content="Lantern Corps" />
		<meta property="og:description" content="A Green Lantern game you play in your browser. Build constructs with the ring and fight across two seasons: 28 missions, free." />
		<meta property="og:url" content="https://lantern-corps.jahbuchimokoli3.workers.dev/" />
		<meta property="og:image" content="https://lantern-corps.jahbuchimokoli3.workers.dev/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Hal Jordan and John Stewart fighting the Sinestro Corps behind a green construct dome" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:creator" content="@jeff_okoli" />
		<script>
			// Chrome offers "install as an app" once, early, often before the game has started:
			// keep the offer so the game's own Install button can use it later ($lib/touch/install.svelte.ts)
			addEventListener('beforeinstallprompt', (e) => {
				e.preventDefault();
				window.__installPrompt = e;
				dispatchEvent(new Event('installprompt'));
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
