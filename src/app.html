<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Added to a phone's home screen, it opens fullscreen and sideways, like an app -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Lantern Corps" />
		<meta name="theme-color" content="#03060a" />
		<meta name="text-scale" content="scale" />
		<script>
			// Chrome offers "install as an app" once, early, often before the game has started:
			// keep the offer so the game's own Install button can use it later ($lib/touch/install.svelte.ts)
			addEventListener('beforeinstallprompt', (e) => {
				e.preventDefault();
				window.__installPrompt = e;
				dispatchEvent(new Event('installprompt'));
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
